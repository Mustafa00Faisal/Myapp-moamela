<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إنجاز - لإدارة المعاملات</title>
    
    <!-- مكتبات التصميم والأيقونات -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- مكتبة توليد الـ PDF الداعمة للعربية -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script>
        // إعداد ألوان Tailwind لتناسب الوضع الليلي الفخم
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#09090b',     // خلفية التطبيق (أسود عميق)
                        darkCard: '#18181b',   // خلفية الكروت (رمادي داكن لتمييزها)
                        accent: '#818cf8'      // لون مضيء للنصوص المهمة
                    }
                }
            }
        }
    </script>

    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: #09090b; /* خلفية رئيسية سوداء */
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* البطاقات البارزة عن الخلفية */
        .glass-card {
            background-color: #18181b; /* لون مختلف عن الخلفية */
            border-radius: 1.5rem;
            border: 1px solid #27272a;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        
        /* إخفاء شريط التمرير */
        ::-webkit-scrollbar { display: none; }
        
        /* تصميم النافذة المنبثقة (Modal) */
        .modal-overlay {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body class="pb-28">

    <!-- الحاوية الرئيسية -->
    <main id="app-content" class="p-4 max-w-md mx-auto min-h-screen"></main>

    <!-- شريط التنقل السفلي الفخم (تم التعديل ليبدأ من اليمين) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#09090b]/90 backdrop-blur-md border-t border-zinc-800 pb-safe z-40">
        <div class="max-w-md mx-auto flex justify-around items-center h-20 px-2 flex-row-reverse" id="bottom-nav">
            <!-- الأزرار تولد برمجياً (الرئيسية ستكون في أقصى اليمين) -->
        </div>
    </nav>

    <!-- حاوية النافذة المنبثقة -->
    <div id="modal-container" class="fixed inset-0 z-50 hidden items-center justify-center modal-overlay p-4 opacity-0 transition-opacity duration-300">
        <div id="modal-content" class="bg-zinc-900 border border-zinc-700 w-full max-w-sm rounded-3xl p-6 shadow-2xl transform scale-95 transition-transform duration-300">
            <!-- محتوى النافذة المنبثقة -->
        </div>
    </div>

    <!-- عنصر مخفي لتوليد الـ PDF -->
    <div id="pdf-container" class="hidden"></div>

    <script>
        // --- 1. إدارة البيانات وقاعدة البيانات المحلية ---
        let appData = JSON.parse(localStorage.getItem('enjaz_data')) || {
            lawyers: ['أ. محمد العبيدي', 'أ. أحمد الجبوري'],
            companies: [
                { name: 'شركة إبهار المستقبل', lawyer: 'أ. محمد العبيدي' },
                { name: 'شركة أرض البيطرة', lawyer: 'أ. أحمد الجبوري' },
                { name: 'شركة الانوار', lawyer: 'أ. محمد العبيدي' }
            ],
            transactions: [
                { id: 1, company: 'شركة إبهار المستقبل', lawyer: 'أ. محمد العبيدي', type: 'تصديق وثائق', department: 'مسجل الشركات', fee: 25000, status: 'active', station: 'قسم التدقيق - أ. ياسر', timestamp: Date.now(), notes: '' }
            ]
        };

        function saveData() {
            localStorage.setItem('enjaz_data', JSON.stringify(appData));
            renderContent(); // تحديث الواجهة بعد الحفظ
        }

        // --- 2. إدارة التنقل والواجهات (مقلوبة لتبدأ الرئيسية من اليمين) ---
        const tabs = [
            { id: 'dashboard', label: 'الرئيسية', icon: 'layout-grid' },
            { id: 'new', label: 'معاملة', icon: 'plus-circle' },
            { id: 'active', label: 'جارية', icon: 'loader' },
            { id: 'stuck', label: 'متلكئة', icon: 'alert-triangle' },
            { id: 'finance', label: 'تحاسب', icon: 'wallet' },
            { id: 'archive', label: 'الأرشيف', icon: 'archive' },
            { id: 'settings', label: 'إعدادات', icon: 'settings' }
        ];

        let currentTab = 'dashboard';

        function renderNav() {
            const navContainer = document.getElementById('bottom-nav');
            // استخدام flex-row-reverse في CSS يعكس الترتيب، لذا نضعها كما هي
            navContainer.innerHTML = tabs.map(tab => `
                <button onclick="switchTab('${tab.id}')" class="flex flex-col items-center justify-center w-full space-y-1 transition-all duration-300 ${currentTab === tab.id ? 'text-indigo-400' : 'text-zinc-500 hover:text-zinc-300'}">
                    <i data-lucide="${tab.icon}" class="w-6 h-6 ${currentTab === tab.id ? 'fill-indigo-900/50' : ''}"></i>
                    <span class="text-[10px] font-bold">${tab.label}</span>
                </button>
            `).join('');
            lucide.createIcons();
        }

        function switchTab(tabId) {
            currentTab = tabId;
            renderNav();
            renderContent();
            window.scrollTo(0,0);
        }

        // --- 3. بناء الواجهات (الصفحات بالكامل) ---
        function renderContent() {
            const content = document.getElementById('app-content');
            
            // 1. الرئيسية
            if (currentTab === 'dashboard') {
                const activeCount = appData.transactions.filter(t => t.status === 'active').length;
                const stuckCount = appData.transactions.filter(t => t.status === 'stuck').length;
                const completedTxs = appData.transactions.filter(t => t.status === 'completed');
                const totalEarnings = completedTxs.reduce((sum, t) => sum + Number(t.fee), 0);
                
                content.innerHTML = `
                    <div class="mb-6 flex items-center gap-3">
                        <div class="bg-indigo-900/50 p-2.5 rounded-2xl border border-indigo-500/30">
                            <i data-lucide="layout-grid" class="text-indigo-400 w-7 h-7"></i>
                        </div>
                        <div>
                            <h1 class="text-2xl font-bold text-white">الرئيسية</h1>
                            <p class="text-sm text-zinc-400 font-semibold">نظرة عامة على نشاطك</p>
                        </div>
                    </div>

                    <div class="bg-gradient-to-br from-indigo-900 to-purple-900 rounded-3xl p-6 text-white mb-5 border border-indigo-700/50 shadow-lg">
                        <div class="flex justify-between items-start mb-4">
                            <h2 class="text-sm font-semibold text-indigo-200">أرباح هذا الأسبوع (لحد الآن)</h2>
                            <i data-lucide="trending-up" class="w-5 h-5 text-indigo-300"></i>
                        </div>
                        <div class="text-4xl font-bold mb-1">${totalEarnings.toLocaleString()} <span class="text-lg text-indigo-300">د.ع</span></div>
                        <p class="text-xs text-indigo-200/70 mt-2">الدورة الحالية: من الأحد إلى الخميس</p>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="glass-card p-5 flex flex-col justify-center">
                            <div class="bg-blue-900/30 w-10 h-10 rounded-full flex items-center justify-center mb-3">
                                <i data-lucide="users" class="text-blue-400 w-5 h-5"></i>
                            </div>
                            <div class="text-2xl font-bold text-white">${appData.lawyers.length}</div>
                            <div class="text-xs text-zinc-400 font-bold mt-1">محامون مسجلون</div>
                        </div>
                        <div class="glass-card p-5 flex flex-col justify-center">
                            <div class="bg-purple-900/30 w-10 h-10 rounded-full flex items-center justify-center mb-3">
                                <i data-lucide="building-2" class="text-purple-400 w-5 h-5"></i>
                            </div>
                            <div class="text-2xl font-bold text-white">${appData.companies.length}</div>
                            <div class="text-xs text-zinc-400 font-bold mt-1">الشركات</div>
                        </div>
                        <div class="glass-card p-5 flex flex-col justify-center border-r-2 border-r-indigo-500">
                            <div class="bg-indigo-900/30 w-10 h-10 rounded-full flex items-center justify-center mb-3">
                                <i data-lucide="loader" class="text-indigo-400 w-5 h-5"></i>
                            </div>
                            <div class="text-2xl font-bold text-white">${activeCount}</div>
                            <div class="text-xs text-zinc-400 font-bold mt-1">معاملات جارية</div>
                        </div>
                        <div class="glass-card p-5 flex flex-col justify-center border-r-2 border-r-rose-500">
                            <div class="bg-rose-900/30 w-10 h-10 rounded-full flex items-center justify-center mb-3">
                                <i data-lucide="alert-triangle" class="text-rose-400 w-5 h-5"></i>
                            </div>
                            <div class="text-2xl font-bold text-white">${stuckCount}</div>
                            <div class="text-xs text-zinc-400 font-bold mt-1">معاملات متلكئة</div>
                        </div>
                    </div>
                `;
            } 
            
            // 2. بدء معاملة جديدة
            else if (currentTab === 'new') {
                content.innerHTML = `
                    <div class="mb-6">
                        <h1 class="text-2xl font-bold text-white">إضافة معاملة</h1>
                        <p class="text-sm text-zinc-400">بدء مسار جديد لشركة</p>
                    </div>
                    <div class="glass-card p-5 space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-zinc-400 mb-2">اسم المحامي</label>
                            <select id="new-lawyer" onchange="updateCompaniesList()" class="w-full bg-zinc-900 border border-zinc-700 text-white rounded-xl p-3 focus:border-indigo-500 outline-none">
                                <option value="">- اختر المحامي -</option>
                                ${appData.lawyers.map(l => `<option value="${l}">${l}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-zinc-400 mb-2">الشركة</label>
                            <select id="new-company" class="w-full bg-zinc-900 border border-zinc-700 text-white rounded-xl p-3 focus:border-indigo-500 outline-none">
                                <option value="">- اختر المحامي أولاً -</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-zinc-400 mb-2">الدائرة</label>
                            <select id="new-dept" class="w-full bg-zinc-900 border border-zinc-700 text-white rounded-xl p-3 focus:border-indigo-500 outline-none">
                                <option value="مسجل الشركات">مسجل الشركات</option>
                                <option value="الاستيراد والتصدير">الاستيراد والتصدير</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-zinc-400 mb-2">نوع المعاملة</label>
                            <input type="text" id="new-type" placeholder="مثال: تصديق وثائق" class="w-full bg-zinc-900 border border-zinc-700 text-white rounded-xl p-3 focus:border-indigo-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-zinc-400 mb-2">الأتعاب (د.ع)</label>
                            <input type="number" id="new-fee" placeholder="0" class="w-full bg-zinc-900 border border-zinc-700 text-white rounded-xl p-3 focus:border-indigo-500 outline-none">
                        </div>
                        <button onclick="addTransaction()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition-colors mt-4">
                            بدء المعاملة
                        </button>
                    </div>
                `;
            }

            // 3. المعاملات الجارية (مع تعديل الألوان لتكون واضحة جداً)
            else if (currentTab === 'active') {
                const activeTx = appData.transactions.filter(t => t.status === 'active');
                
                content.innerHTML = `
                    <div class="mb-6">
                        <h1 class="text-2xl font-bold text-white">المعاملات الجارية</h1>
                        <p class="text-sm text-zinc-400 font-semibold">تتبع مسار معاملاتك الميدانية</p>
                    </div>
                    <div class="space-y-4">
                        ${activeTx.length === 0 ? '<div class="text-center text-zinc-500 mt-10">لا توجد معاملات جارية حالياً</div>' : 
                        activeTx.map(t => `
                            <!-- كرت المعاملة بخلفية مميزة ونص مضيء -->
                            <div onclick="openModal(${t.id})" class="glass-card p-4 active:scale-95 transition-transform duration-200 cursor-pointer border-r-4 border-r-indigo-500 relative">
                                <div class="flex justify-between items-start mb-1">
                                    <h3 class="font-bold text-lg text-white">${t.company}</h3>
                                    <span class="bg-indigo-900/50 text-indigo-300 text-[10px] font-bold px-2 py-1 rounded-full border border-indigo-700/50">${t.department}</span>
                                </div>
                                <!-- لون النص هنا أصبح سماوي/نيون ليكون مقروءاً بوضوح -->
                                <div class="text-sm mb-4 font-bold text-cyan-400">${t.type}</div>
                                
                                <div class="bg-zinc-900/80 p-3 rounded-xl border border-zinc-800 flex items-center gap-3">
                                    <div class="bg-zinc-800 p-1.5 rounded-lg">
                                        <i data-lucide="map-pin" class="w-4 h-4 text-indigo-400"></i>
                                    </div>
                                    <div>
                                        <div class="text-[10px] text-zinc-400 font-bold">المحطة الحالية</div>
                                        <div class="text-sm font-bold text-zinc-100">${t.station}</div>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            // 4. المتلكئة
            else if (currentTab === 'stuck') {
                const stuckTx = appData.transactions.filter(t => t.status === 'stuck');
                content.innerHTML = `
                    <div class="mb-6">
                        <h1 class="text-2xl font-bold text-white">المعاملات المتلكئة</h1>
                        <p class="text-sm text-zinc-400">المعاملات المتوقفة لوجود أخطاء</p>
                    </div>
                    <div class="space-y-4">
                        ${stuckTx.length === 0 ? '<div class="text-center text-zinc-500 mt-10">الحمدلله، لا يوجد تلكؤ!</div>' : 
                        stuckTx.map(t => `
                            <div class="glass-card p-4 border-r-4 border-r-rose-500">
                                <h3 class="font-bold text-lg text-white">${t.company}</h3>
                                <div class="text-sm font-bold text-rose-400 mb-2">${t.type}</div>
                                <div class="bg-rose-950/30 p-3 rounded-xl border border-rose-900/50 mb-3">
                                    <div class="text-[10px] text-rose-300 font-bold">سبب التلكؤ:</div>
                                    <div class="text-sm text-zinc-200">${t.notes || 'لم يكتب سبب'}</div>
                                </div>
                                <div class="flex gap-2">
                                    <button onclick="changeStatus(${t.id}, 'active')" class="flex-1 bg-zinc-800 hover:bg-zinc-700 text-white text-xs font-bold py-2 rounded-lg transition-colors">
                                        إعادة للعمل
                                    </button>
                                    <button onclick="notifyLawyer('${t.lawyer}', '${t.company}', '${t.notes}')" class="flex-1 bg-green-900/40 text-green-400 border border-green-800 text-xs font-bold py-2 rounded-lg flex items-center justify-center gap-1">
                                        <i data-lucide="message-circle" class="w-3 h-3"></i> إبلاغ واتساب
                                    </button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            // 5. التحاسب
            else if (currentTab === 'finance') {
                const completed = appData.transactions.filter(t => t.status === 'completed');
                
                // تجميع الأتعاب حسب المحامي
                const lawyerTotals = {};
                completed.forEach(t => {
                    if (!lawyerTotals[t.lawyer]) lawyerTotals[t.lawyer] = { total: 0, txs: [] };
                    lawyerTotals[t.lawyer].total += Number(t.fee);
                    lawyerTotals[t.lawyer].txs.push(t);
                });

                content.innerHTML = `
                    <div class="mb-6">
                        <h1 class="text-2xl font-bold text-white">التحاسب المالي</h1>
                        <p class="text-sm text-zinc-400">إغلاق دورة الخميس</p>
                    </div>
                    <div class="space-y-4">
                        ${Object.keys(lawyerTotals).length === 0 ? '<div class="text-center text-zinc-500 mt-10">لا توجد معاملات منجزة للتحاسب</div>' : 
                        Object.keys(lawyerTotals).map(lawyer => `
                            <div class="glass-card p-5">
                                <div class="flex justify-between items-center mb-3">
                                    <h3 class="font-bold text-lg text-white">${lawyer}</h3>
                                    <div class="text-lg font-bold text-indigo-400">${lawyerTotals[lawyer].total.toLocaleString()} <span class="text-xs">د.ع</span></div>
                                </div>
                                <p class="text-xs text-zinc-400 mb-4">${lawyerTotals[lawyer].txs.length} معاملات منجزة</p>
                                
                                <button onclick="generatePDF('${lawyer}')" class="w-full bg-zinc-800 hover:bg-zinc-700 text-white border border-zinc-700 font-bold py-2 rounded-xl flex items-center justify-center gap-2">
                                    <i data-lucide="file-down" class="w-4 h-4"></i>
                                    تنزيل تقرير PDF
                                </button>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            // 6. الأرشيف
            else if (currentTab === 'archive') {
                const archived = appData.transactions.filter(t => t.status === 'completed');
                content.innerHTML = `
                    <div class="mb-6">
                        <h1 class="text-2xl font-bold text-white">الأرشيف</h1>
                        <p class="text-sm text-zinc-400">سجل المعاملات المنجزة</p>
                    </div>
                    <div class="space-y-3">
                        ${archived.length === 0 ? '<div class="text-center text-zinc-500 mt-10">الأرشيف فارغ</div>' : 
                        archived.map(t => `
                            <div class="glass-card p-4 flex justify-between items-center">
                                <div>
                                    <h3 class="font-bold text-white text-sm">${t.company}</h3>
                                    <p class="text-xs text-indigo-300 font-bold">${t.type}</p>
                                </div>
                                <div class="text-xs text-green-400 font-bold bg-green-900/30 px-2 py-1 rounded-md border border-green-800/50">
                                    منجزة
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            // 7. الإعدادات
            else if (currentTab === 'settings') {
                content.innerHTML = `
                    <div class="mb-6">
                        <h1 class="text-2xl font-bold text-white">الإعدادات</h1>
                    </div>
                    <div class="glass-card p-5 space-y-4">
                        <h3 class="text-zinc-300 font-bold text-sm mb-2">إدارة البيانات</h3>
                        <button onclick="factoryReset()" class="w-full bg-rose-900/30 text-rose-400 border border-rose-800/50 font-bold py-3 rounded-xl flex items-center justify-center gap-2">
                            <i data-lucide="trash-2" class="w-5 h-5"></i>
                            مسح جميع البيانات (تصفير)
                        </button>
                    </div>
                `;
            }
            
            lucide.createIcons();
        }

        // --- 4. منطق الوظائف (أزرار ومهام) ---
        
        // تحديث قائمة الشركات عند اختيار محامي في صفحة "إضافة"
        function updateCompaniesList() {
            const lawyer = document.getElementById('new-lawyer').value;
            const companySelect = document.getElementById('new-company');
            const comps = appData.companies.filter(c => c.lawyer === lawyer);
            
            companySelect.innerHTML = comps.length > 0 
                ? comps.map(c => `<option value="${c.name}">${c.name}</option>`).join('')
                : '<option value="">لا توجد شركات لهذا المحامي</option>';
        }

        // إضافة معاملة جديدة
        function addTransaction() {
            const lawyer = document.getElementById('new-lawyer').value;
            const company = document.getElementById('new-company').value;
            const dept = document.getElementById('new-dept').value;
            const type = document.getElementById('new-type').value;
            const fee = document.getElementById('new-fee').value;

            if(!lawyer || !company || !type || !fee) {
                alert('يرجى تعبئة جميع الحقول'); return;
            }

            appData.transactions.push({
                id: Date.now(), company, lawyer, department: dept, type, fee, status: 'active', station: 'قيد الاستلام', timestamp: Date.now(), notes: ''
            });
            saveData();
            switchTab('active');
        }

        // النافذة المنبثقة للتحكم بالمعاملة الجارية
        function openModal(id) {
            const tx = appData.transactions.find(t => t.id === id);
            const modalContainer = document.getElementById('modal-container');
            const modalContent = document.getElementById('modal-content');

            modalContent.innerHTML = `
                <div class="flex justify-between items-center mb-5">
                    <h2 class="text-xl font-bold text-white">إدارة المعاملة</h2>
                    <button onclick="closeModal()" class="bg-zinc-800 p-2 rounded-full text-zinc-400 hover:text-white">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
                
                <div class="mb-5">
                    <div class="text-sm text-zinc-400 font-bold mb-1">الشركة</div>
                    <div class="font-bold text-lg text-indigo-400">${tx.company}</div>
                </div>

                <div class="space-y-3">
                    <div class="bg-zinc-800 p-3 rounded-xl border border-zinc-700">
                        <label class="block text-xs font-bold text-zinc-400 mb-2">تحديث المحطة:</label>
                        <div class="flex gap-2">
                            <input type="text" id="update-station-val" value="${tx.station}" class="w-full bg-zinc-900 border border-zinc-600 text-white rounded-lg p-2 text-sm">
                            <button onclick="updateStation(${tx.id})" class="bg-indigo-600 text-white px-3 rounded-lg font-bold text-sm">حفظ</button>
                        </div>
                    </div>
                    
                    <div class="bg-rose-950/30 p-3 rounded-xl border border-rose-900/50">
                        <label class="block text-xs font-bold text-rose-300 mb-2">نقل للمتلكئة (السبب):</label>
                        <div class="flex gap-2">
                            <input type="text" id="stuck-reason-val" placeholder="اكتب المشكلة..." class="w-full bg-zinc-900 border border-rose-800/50 text-white rounded-lg p-2 text-sm">
                            <button onclick="moveToStuck(${tx.id})" class="bg-rose-600 text-white px-3 rounded-lg font-bold text-sm">نقل</button>
                        </div>
                    </div>

                    <button onclick="changeStatus(${tx.id}, 'completed')" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-2 mt-2">
                        <i data-lucide="check-circle-2" class="w-5 h-5"></i>
                        <span>إنجاز المعاملة نهائياً</span>
                    </button>
                </div>
            `;

            modalContainer.classList.remove('hidden');
            modalContainer.classList.add('flex');
            setTimeout(() => {
                modalContainer.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
            }, 10);
            lucide.createIcons();
        }

        function closeModal() {
            const modalContainer = document.getElementById('modal-container');
            const modalContent = document.getElementById('modal-content');
            
            modalContainer.classList.add('opacity-0');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modalContainer.classList.add('hidden');
                modalContainer.classList.remove('flex');
            }, 300);
        }

        function updateStation(id) {
            const val = document.getElementById('update-station-val').value;
            const tx = appData.transactions.find(t => t.id === id);
            tx.station = val;
            tx.timestamp = Date.now();
            saveData();
            closeModal();
        }

        function moveToStuck(id) {
            const val = document.getElementById('stuck-reason-val').value;
            const tx = appData.transactions.find(t => t.id === id);
            tx.status = 'stuck';
            tx.notes = val;
            saveData();
            closeModal();
        }

        function changeStatus(id, newStatus) {
            const tx = appData.transactions.find(t => t.id === id);
            tx.status = newStatus;
            if(newStatus === 'active') tx.notes = ''; // مسح ملاحظة التلكؤ عند الإعادة
            saveData();
            if(document.getElementById('modal-container').classList.contains('flex')) closeModal();
        }

        function notifyLawyer(lawyer, company, note) {
            const text = encodeURIComponent(`مرحباً ${lawyer}،\nتوجد مشكلة في معاملة شركة (${company}).\nالسبب: ${note || 'يرجى التواصل لمعرفة التفاصيل'}.`);
            window.open(`https://wa.me/?text=${text}`, '_blank');
        }

        // توليد ملف PDF حقيقي للتحاسب
        function generatePDF(lawyerName) {
            const txs = appData.transactions.filter(t => t.status === 'completed' && t.lawyer === lawyerName);
            const total = txs.reduce((sum, t) => sum + Number(t.fee), 0);
            
            const pdfHTML = `
                <div style="padding: 40px; font-family: 'Cairo', sans-serif; direction: rtl; text-align: right; background: white; color: black;">
                    <h1 style="color: #4f46e5; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px;">كشف حساب - إنجاز</h1>
                    <h3 style="margin-top: 20px;">المحامي: <strong>${lawyerName}</strong></h3>
                    <p>التاريخ: ${new Date().toLocaleDateString('ar-IQ')}</p>
                    
                    <table style="width: 100%; margin-top: 30px; border-collapse: collapse;">
                        <tr style="background: #f3f4f6;">
                            <th style="padding: 10px; border: 1px solid #d1d5db;">الشركة</th>
                            <th style="padding: 10px; border: 1px solid #d1d5db;">المعاملة</th>
                            <th style="padding: 10px; border: 1px solid #d1d5db;">الأتعاب</th>
                        </tr>
                        ${txs.map(t => `
                            <tr>
                                <td style="padding: 10px; border: 1px solid #d1d5db;">${t.company}</td>
                                <td style="padding: 10px; border: 1px solid #d1d5db;">${t.type}</td>
                                <td style="padding: 10px; border: 1px solid #d1d5db;">${t.fee} د.ع</td>
                            </tr>
                        `).join('')}
                    </table>
                    
                    <h2 style="margin-top: 30px; background: #4f46e5; color: white; padding: 15px; text-align: center; border-radius: 8px;">
                        الإجمالي: ${total.toLocaleString()} دينار عراقي
                    </h2>
                </div>
            `;
            
            const container = document.getElementById('pdf-container');
            container.innerHTML = pdfHTML;
            container.classList.remove('hidden');
            
            html2pdf().from(container).set({
                margin: 1,
                filename: `كشف_حساب_${lawyerName}.pdf`,
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
            }).save().then(() => {
                container.classList.add('hidden');
            });
        }

        function factoryReset() {
            if(confirm('تحذير: هل أنت متأكد من مسح جميع المعاملات وبدء أسبوع جديد نظيف؟ لا يمكن التراجع!')) {
                // نحتفظ بأسماء المحامين والشركات، ونمسح المعاملات فقط
                appData.transactions = [];
                saveData();
                alert('تم التصفير بنجاح!');
            }
        }

        // التهيئة الأولية
        renderNav();
        renderContent();
    </script>
</body>
</html>
