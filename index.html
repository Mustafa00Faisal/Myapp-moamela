<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إنجاز - لإدارة المعاملات</title>
    
    <!-- مكتبات التصميم والأيقونات -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- مكتبة توليد الـ PDF الداعمة للعربية -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: #f8fafc; /* أبيض/رمادي فاتح جداً */
            -webkit-tap-highlight-color: transparent;
        }
        /* التدرج اللوني الفخم (أزرق إلى بنفسجي) */
        .bg-gradient-primary { background: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%); }
        .text-gradient { background: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* البطاقات الزجاجية البيضاء */
        .glass-card {
            background: #ffffff;
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        
        /* إخفاء شريط التمرير لجمالية التطبيق */
        ::-webkit-scrollbar { display: none; }
        
        /* تصميم النافذة المنبثقة (Modal) */
        .modal-overlay {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="pb-24 text-slate-800">

    <!-- الحاوية الرئيسية للمحتوى المتغير -->
    <main id="app-content" class="p-4 max-w-md mx-auto min-h-screen"></main>

    <!-- شريط التنقل السفلي الفخم -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-200 pb-safe z-40 shadow-[0_-10px_40px_rgba(0,0,0,0.03)]">
        <div class="max-w-md mx-auto flex justify-around items-center h-20 px-2" id="bottom-nav">
            <!-- سيتم توليد الأزرار عبر الجافاسكربت -->
        </div>
    </nav>

    <!-- حاوية النافذة المنبثقة -->
    <div id="modal-container" class="fixed inset-0 z-50 hidden items-center justify-center modal-overlay p-4 opacity-0 transition-opacity duration-300">
        <div id="modal-content" class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl transform scale-95 transition-transform duration-300">
            <!-- محتوى النافذة المنبثقة -->
        </div>
    </div>

    <script>
        // --- 1. إدارة البيانات (Local Storage) ---
        let appData = JSON.parse(localStorage.getItem('enjaz_data')) || {
            lawyers: ['أ. محمد العبيدي', 'أ. أحمد الجبوري'],
            companies: [
                { name: 'شركة إبهار المستقبل', lawyer: 'أ. محمد العبيدي' },
                { name: 'شركة أرض البيطرة', lawyer: 'أ. أحمد الجبوري' }
            ],
            transactions: [
                { id: 1, company: 'شركة إبهار المستقبل', lawyer: 'أ. محمد العبيدي', type: 'تصديق وثائق', department: 'مسجل الشركات', fee: 25000, status: 'active', station: 'قسم التدقيق - أ. ياسر', timestamp: Date.now() }
            ]
        };

        function saveData() {
            localStorage.setItem('enjaz_data', JSON.stringify(appData));
        }

        // --- 2. إدارة التنقل والواجهات ---
        const tabs = [
            { id: 'settings', label: 'إعدادات', icon: 'settings' },
            { id: 'archive', label: 'الأرشيف', icon: 'archive' },
            { id: 'finance', label: 'تحاسب', icon: 'wallet' },
            { id: 'stuck', label: 'متلكئة', icon: 'alert-triangle' },
            { id: 'active', label: 'جارية', icon: 'loader' },
            { id: 'new', label: 'معاملة', icon: 'plus-circle' },
            { id: 'dashboard', label: 'الرئيسية', icon: 'layout-grid' }
        ];

        let currentTab = 'dashboard';

        function renderNav() {
            const navContainer = document.getElementById('bottom-nav');
            navContainer.innerHTML = tabs.map(tab => `
                <button onclick="switchTab('${tab.id}')" class="flex flex-col items-center justify-center w-full space-y-1 transition-all duration-300 ${currentTab === tab.id ? 'text-indigo-600' : 'text-slate-400 hover:text-slate-600'}">
                    <i data-lucide="${tab.icon}" class="w-6 h-6 ${currentTab === tab.id ? 'fill-indigo-100' : ''}"></i>
                    <span class="text-[10px] font-bold">${tab.label}</span>
                </button>
            `).join('');
            lucide.createIcons();
        }

        function switchTab(tabId) {
            currentTab = tabId;
            renderNav();
            renderContent();
        }

        // --- 3. بناء الواجهات (الصفحات) ---
        function renderContent() {
            const content = document.getElementById('app-content');
            
            if (currentTab === 'dashboard') {
                // حساب إحصائيات الأسبوع
                const activeCount = appData.transactions.filter(t => t.status === 'active').length;
                const stuckCount = appData.transactions.filter(t => t.status === 'stuck').length;
                
                content.innerHTML = `
                    <div class="mb-6 flex items-center gap-3">
                        <div class="bg-indigo-100 p-2.5 rounded-2xl">
                            <i data-lucide="layout-grid" class="text-indigo-600 w-7 h-7"></i>
                        </div>
                        <div>
                            <h1 class="text-2xl font-bold text-slate-800">الرئيسية</h1>
                            <p class="text-sm text-slate-500 font-semibold">نظرة عامة على نشاطك</p>
                        </div>
                    </div>

                    <!-- بطاقة الأرباح (Bento Box Design) -->
                    <div class="bg-gradient-primary rounded-3xl p-6 text-white mb-4 shadow-lg shadow-indigo-200">
                        <div class="flex justify-between items-start mb-4">
                            <h2 class="text-sm font-semibold opacity-90">أرباح هذا الأسبوع</h2>
                            <i data-lucide="trending-up" class="w-5 h-5 opacity-80"></i>
                        </div>
                        <div class="text-4xl font-bold mb-1">0 <span class="text-lg opacity-80">د.ع</span></div>
                        <p class="text-xs opacity-75 mt-2">الدورة الحالية: من الأحد إلى الخميس</p>
                    </div>

                    <!-- شبكة الإحصائيات -->
                    <div class="grid grid-cols-2 gap-4">
                        <div class="glass-card p-5 flex flex-col justify-center">
                            <div class="bg-blue-50 w-10 h-10 rounded-full flex items-center justify-center mb-3">
                                <i data-lucide="users" class="text-blue-600 w-5 h-5"></i>
                            </div>
                            <div class="text-2xl font-bold text-slate-800">${appData.lawyers.length}</div>
                            <div class="text-xs text-slate-500 font-bold mt-1">محامون مسجلون</div>
                        </div>
                        <div class="glass-card p-5 flex flex-col justify-center">
                            <div class="bg-purple-50 w-10 h-10 rounded-full flex items-center justify-center mb-3">
                                <i data-lucide="building-2" class="text-purple-600 w-5 h-5"></i>
                            </div>
                            <div class="text-2xl font-bold text-slate-800">${appData.companies.length}</div>
                            <div class="text-xs text-slate-500 font-bold mt-1">الشركات</div>
                        </div>
                        <div class="glass-card p-5 flex flex-col justify-center border-l-4 border-l-indigo-500">
                            <div class="bg-indigo-50 w-10 h-10 rounded-full flex items-center justify-center mb-3">
                                <i data-lucide="loader" class="text-indigo-600 w-5 h-5"></i>
                            </div>
                            <div class="text-2xl font-bold text-slate-800">${activeCount}</div>
                            <div class="text-xs text-slate-500 font-bold mt-1">معاملات جارية</div>
                        </div>
                        <div class="glass-card p-5 flex flex-col justify-center border-l-4 border-l-rose-500">
                            <div class="bg-rose-50 w-10 h-10 rounded-full flex items-center justify-center mb-3">
                                <i data-lucide="alert-triangle" class="text-rose-600 w-5 h-5"></i>
                            </div>
                            <div class="text-2xl font-bold text-slate-800">${stuckCount}</div>
                            <div class="text-xs text-slate-500 font-bold mt-1">معاملات متلكئة</div>
                        </div>
                    </div>
                `;
            } 
            else if (currentTab === 'active') {
                const activeTx = appData.transactions.filter(t => t.status === 'active');
                
                content.innerHTML = `
                    <div class="mb-6">
                        <h1 class="text-2xl font-bold text-slate-800">المعاملات الجارية</h1>
                        <p class="text-sm text-slate-500 font-semibold">تتبع مسار معاملاتك الميدانية</p>
                    </div>
                    <div class="space-y-4">
                        ${activeTx.length === 0 ? '<div class="text-center text-slate-400 mt-10">لا توجد معاملات جارية حالياً</div>' : 
                        activeTx.map(t => `
                            <!-- كرت مستطيل تفاعلي قابل للضغط -->
                            <div onclick="openTransactionModal(${t.id})" class="glass-card p-4 active:scale-95 transition-transform duration-200 cursor-pointer border-r-4 border-r-indigo-500 relative overflow-hidden">
                                <div class="flex justify-between items-start mb-2">
                                    <h3 class="font-bold text-lg text-slate-800">${t.company}</h3>
                                    <span class="bg-indigo-50 text-indigo-700 text-[10px] font-bold px-2 py-1 rounded-full">${t.department}</span>
                                </div>
                                <div class="text-sm text-slate-600 mb-3 font-semibold text-gradient">${t.type}</div>
                                
                                <!-- المحطة الحالية -->
                                <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 flex items-center gap-3">
                                    <div class="bg-white p-1.5 rounded-lg shadow-sm">
                                        <i data-lucide="map-pin" class="w-4 h-4 text-indigo-500"></i>
                                    </div>
                                    <div>
                                        <div class="text-[10px] text-slate-400 font-bold">المحطة الحالية</div>
                                        <div class="text-xs font-bold text-slate-700">${t.station}</div>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
            else {
                content.innerHTML = `
                    <div class="flex flex-col items-center justify-center min-h-[60vh] text-center">
                        <i data-lucide="settings" class="w-16 h-16 text-slate-300 mb-4 animate-spin-slow"></i>
                        <h2 class="text-xl font-bold text-slate-700 mb-2">جاري برمجة هذه الواجهة</h2>
                        <p class="text-sm text-slate-500">سيتم إضافة صفحة (${tabs.find(t=>t.id===currentTab).label}) في التحديث القادم.</p>
                    </div>
                `;
            }
            lucide.createIcons();
        }

        // --- 4. النافذة المنبثقة (Modal) التفاعلية ---
        function openTransactionModal(id) {
            const tx = appData.transactions.find(t => t.id === id);
            const modalContainer = document.getElementById('modal-container');
            const modalContent = document.getElementById('modal-content');

            modalContent.innerHTML = `
                <div class="flex justify-between items-center mb-5">
                    <h2 class="text-xl font-bold text-slate-800">إدارة المعاملة</h2>
                    <button onclick="closeModal()" class="bg-slate-100 p-2 rounded-full text-slate-500 hover:bg-slate-200">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
                
                <div class="mb-5">
                    <div class="text-sm text-slate-500 font-bold mb-1">الشركة</div>
                    <div class="font-bold text-lg text-indigo-700">${tx.company}</div>
                    <div class="text-xs text-slate-500 mt-1">المحامي: ${tx.lawyer}</div>
                </div>

                <div class="space-y-3">
                    <button class="w-full bg-slate-50 border border-slate-200 text-slate-700 font-bold py-3 px-4 rounded-xl flex items-center justify-between hover:bg-slate-100 transition-colors">
                        <span>تحديث المحطة (الموقع)</span>
                        <i data-lucide="map-pin" class="w-5 h-5 text-blue-500"></i>
                    </button>
                    
                    <button class="w-full bg-slate-50 border border-slate-200 text-slate-700 font-bold py-3 px-4 rounded-xl flex items-center justify-between hover:bg-slate-100 transition-colors">
                        <span>نقل إلى المتلكئة (إبلاغ المحامي)</span>
                        <i data-lucide="alert-triangle" class="w-5 h-5 text-rose-500"></i>
                    </button>

                    <button class="w-full bg-gradient-primary text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-indigo-200 active:scale-95 transition-transform">
                        <i data-lucide="check-circle-2" class="w-5 h-5"></i>
                        <span>إنجاز المعاملة</span>
                    </button>
                </div>
            `;

            modalContainer.classList.remove('hidden');
            modalContainer.classList.add('flex');
            // تأخير بسيط لتفعيل الأنيميشن
            setTimeout(() => {
                modalContainer.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95', 'translate-y-4');
            }, 10);
            
            lucide.createIcons();
        }

        function closeModal() {
            const modalContainer = document.getElementById('modal-container');
            const modalContent = document.getElementById('modal-content');
            
            modalContainer.classList.add('opacity-0');
            modalContent.classList.add('scale-95');
            
            setTimeout(() => {
                modalContainer.classList.add('hidden');
                modalContainer.classList.remove('flex');
            }, 300);
        }

        // التهيئة الأولية
        renderNav();
        renderContent();
    </script>
</body>
</html>
