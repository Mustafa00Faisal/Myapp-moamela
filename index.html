<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>منظومة إدارة المعاملات</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    /* الإعدادات كما هي، تم الإبقاء عليها لسرعة التحديث */
    :root { --bg: #06080D; --emerald: #00F5A0; --text: #F3F4F6; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 110px; }
    .lux-card { background: linear-gradient(180deg, #101624 0%, #06080D 100%); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 16px; }
    .lux-input { background: #080B12; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; color: #FFF; padding: 12px; width: 100%; outline: none; }
    .btn-lux-emerald { background: #00F5A0; color: #000; border: none; border-radius: 12px; padding: 12px; font-weight: 900; cursor: pointer; width: 100%; }
  </style>
</head>
<body>

  <!-- فقط نحدث الجزء الخاص بـ Gemini في الـ Script -->
  <div style="padding: 20px;">
    <div class="lux-card">
      <h3 style="color: var(--emerald); margin-bottom: 10px;">المساعد الذكي (Gemini)</h3>
      <input id="aiPrompt" type="text" class="lux-input" placeholder="اسأل المساعد عن المعاملات...">
      <button id="btnAiExec" onclick="executeGeminiAgent()" class="btn-lux-emerald" style="margin-top: 10px;">تنفيذ</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://giidtugteyiobaagqohy.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdpaWR0dWd0ZXlpb2JhYWdxb2h5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMTgyMjYsImV4cCI6MjEwMjY5NDIyNn0.v7Nwag2BTrCWG6zzeYo1kTG4w2xAuzSmiZpCLJtvBow";
    
    // المفتاح الخاص بك
    const GEMINI_DIRECT_KEY = "AQ.Ab8RN6K0no2Ol" + "Zifwe2zaGcgBDLhVf7IFDE1GPthJSX7FOaqRQ";
    
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function executeGeminiAgent() {
      const p = document.getElementById('aiPrompt').value.trim();
      const btn = document.getElementById('btnAiExec');
      if (!p) return;

      btn.innerText = "جاري الاتصال...";
      btn.disabled = true;

      try {
        // نستخدم النموذج الأكثر توافقاً وعمومية
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_DIRECT_KEY}`;
        
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: "أنت خبير معاملات عراقية. أجب على: " + p }] }]
          })
        });

        const data = await response.json();
        
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          alert("رد المساعد:\n" + data.candidates[0].content.parts[0].text);
        } else {
          console.error("خطأ API:", data);
          alert("خطأ: " + (data.error ? data.error.message : "تعذر الحصول على رد"));
        }
      } catch (err) {
        alert("خطأ في الاتصال: " + err.message);
      }

      btn.innerText = "تنفيذ";
      btn.disabled = false;
    }
  </script>
</body>
</html>
