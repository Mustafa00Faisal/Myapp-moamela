<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام إدارة المعاملات</title>
    <style>:root { color-scheme: light; } body { font-family: sans-serif; background-color: #f8fafc; }</style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [activeTab, setActiveTab] = useState('home');
            const [transactions, setTransactions] = useState([]);
            const [showAdd, setShowAdd] = useState(false);

            useEffect(() => {
                const saved = localStorage.getItem('txs');
                setTransactions(saved ? JSON.parse(saved) : []);
            }, []);

            const addTx = (e) => {
                e.preventDefault();
                const newTx = { id: Date.now(), company: e.target.comp.value, fee: parseInt(e.target.fee.value), status: 'active', date: new Date() };
                const updated = [...transactions, newTx];
                setTransactions(updated);
                localStorage.setItem('txs', JSON.stringify(updated));
                setShowAdd(false);
            };

            return (
                <div className="pb-24 max-w-md mx-auto min-h-screen bg-slate-50">
                    
                    {/* محتوى الصفحات */}
                    <div className="p-6">
                        {activeTab === 'home' && (
                            <>
                                <h1 className="text-2xl font-black text-slate-800 mb-6">المعاملات الجارية</h1>
                                {transactions.map(t => (
                                    <div key={t.id} className="bg-white p-5 rounded-3xl shadow-sm mb-4 border border-slate-100">
                                        <h3 className="font-bold">{t.company}</h3>
                                        <p className="text-purple-600 font-bold">{t.fee} د.ع</p>
                                    </div>
                                ))}
                            </>
                        )}

                        {activeTab === 'finance' && (
                            <div>
                                <h1 className="text-2xl font-black mb-6">التحاسب المالي</h1>
                                <div className="bg-gradient-to-r from-pink-500 to-purple-600 p-8 rounded-[32px] text-white shadow-xl shadow-purple-200">
                                    <p className="text-sm opacity-80">إجمالي المستحقات</p>
                                    <h2 className="text-4xl font-bold mt-2">{transactions.reduce((acc, curr) => acc + curr.fee, 0)} د.ع</h2>
                                </div>
                            </div>
                        )}

                        {activeTab === 'settings' && (
                            <div>
                                <h1 className="text-2xl font-black mb-6">الإعدادات</h1>
                                <button onClick={() => { localStorage.clear(); window.location.reload(); }} className="w-full bg-red-50 text-red-600 p-4 rounded-2xl font-bold">تصفير النظام</button>
                            </div>
                        )}
                    </div>

                    {/* نافذة الإضافة */}
                    {showAdd && (
                        <div className="fixed inset-0 bg-slate-50 z-50 p-6 flex flex-col justify-center">
                            <form onSubmit={addTx} className="bg-white p-6 rounded-3xl shadow-xl">
                                <h2 className="text-xl font-bold mb-4">معاملة جديدة</h2>
                                <input name="comp" placeholder="اسم الشركة" required className="w-full p-4 bg-slate-100 rounded-2xl mb-3"/>
                                <input name="fee" type="number" placeholder="الأتعاب" required className="w-full p-4 bg-slate-100 rounded-2xl mb-6"/>
                                <div className="flex gap-3">
                                    <button type="submit" className="flex-1 bg-purple-600 text-white p-4 rounded-2xl font-bold">حفظ</button>
                                    <button type="button" onClick={() => setShowAdd(false)} className="p-4 rounded-2xl bg-slate-100 font-bold">إلغاء</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* شريط التنقل السفلي */}
                    <div className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-slate-100 p-4 flex justify-around items-center">
                        <button onClick={() => setActiveTab('home')} className={activeTab === 'home' ? 'text-purple-600' : 'text-slate-400'}>الرئيسية</button>
                        <button onClick={() => setShowAdd(true)} className="bg-purple-600 text-white w-14 h-14 rounded-full shadow-lg -mt-10 flex items-center justify-center font-bold text-2xl">+</button>
                        <button onClick={() => setActiveTab('finance')} className={activeTab === 'finance' ? 'text-purple-600' : 'text-slate-400'}>المالية</button>
                        <button onClick={() => setActiveTab('settings')} className={activeTab === 'settings' ? 'text-purple-600' : 'text-slate-400'}>الإعدادات</button>
                    </div>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
